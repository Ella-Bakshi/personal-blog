name: Rebuild blog

# Auto-detects new posts/*.md files on every push and regenerates
# index.html, feed.xml, posts.json and the per-post HTML pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-rebuild
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild site from posts/*.md
        run: python3 build.py

      - name: Commit regenerated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-rebuild archive (new/changed posts detected)"
          file_pattern: "index.html feed.xml posts.json posts/*.html"
